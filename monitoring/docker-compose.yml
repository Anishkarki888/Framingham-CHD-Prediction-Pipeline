version: '3.9'

services:
  # ---------------- MariaDB ----------------
  mariadb:
    image: mariadb:10.11
    container_name: mariadb_container
    environment:
      MYSQL_ROOT_PASSWORD: Pa55W0rd123#
      MYSQL_DATABASE: Framingham
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    networks:
      - mlops

  # ---------------- Redis ----------------
  redis:
    image: redis:7.0-alpine
    container_name: redis_container
    ports:
      - "6380:6379"
    restart: always
    networks:
      - mlops

  # ---------------- MLflow ----------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: mlflow_container
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    networks:
      - mlops

  # ---------------- Monitoring (Python Metrics) ----------------
  monitor_model:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: monitor_model_container
    ports:
      - "8001:8001"  # Python metrics server
    volumes:
      - ./models:/app/models:rw
      - ./data:/app/data:rw
      - ./reports:/app/reports:rw
      - mlflow_data:/app/mlflow:rw
    environment:
      - MODELS_PATH=/app/models
      - DATA_PATH=/app/data
      - REPORTS_PATH=/app/reports
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PROMETHEUS_PORT=8001
    command: python monitor_model.py
    depends_on:
      - mlflow
      - mariadb
      - redis
    networks:
      - mlops
    restart: unless-stopped

  # ---------------- Prometheus ----------------


  prometheus:
    image: prom/prometheus
    container_name: prometheus_container
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana_container
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  framingham_app:
    build: .
    container_name: framingham_app_container
    command: uvicorn home_app:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    restart: unless-stopped


  # ---------------- Streamlit UI ----------------
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit_container
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app:rw
      - mlflow_data:/app/mlflow
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: streamlit run /app/app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - mlflow
      - mariadb
    networks:
      - mlops

volumes:
  mariadb_data:
  mlflow_data:
  grafana_data:
  prometheus_data:

networks:
  mlops:
    driver: bridge
